# Campos Libres - Producción / VPS
# Uso en VPS: copiar este archivo a la raíz junto a Front-End y Back-End:
#   cp deploy/docker-compose.prod.yml .
#   cp deploy/.env.example .env  && nano .env
#   sudo docker compose -f docker-compose.prod.yml up -d --build
# Si usas Nginx Proxy Manager: frontend en 9080, API en 3000.

services:
  db:
    image: postgres:15-alpine
    container_name: campos_libres_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-campos_libres_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-campos_libres_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: ./Back-End
      dockerfile: dockerfile
      target: production
    container_name: campos_libres_api
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-campos_libres_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./Front-End
      dockerfile: Dockerfile
      target: production
      args:
        BUILD_CONFIG: vps
    container_name: campos_libres_frontend
    restart: always
    ports:
      - "127.0.0.1:9080:80"
    depends_on:
      - api

volumes:
  postgres_data:
